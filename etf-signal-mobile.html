<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ETF Signal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f2eb;
  --surface: #ffffff;
  --surface2: #f0ece2;
  --border: #d9d3c4;
  --text: #1a1814;
  --muted: #8c8679;
  --buy: #1a6b3c;
  --buy-bg: #e8f4ed;
  --buy-border: #b8dfc9;
  --sell: #8b2020;
  --sell-bg: #f8eaea;
  --sell-border: #e8c0c0;
  --neutral: #5a5040;
  --accent: #c9a84c;
  --radius: 12px;
}

body {
  font-family: 'DM Mono', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
  padding-bottom: 100px;
}

/* HEADER */
.header {
  background: var(--text);
  color: var(--bg);
  padding: 20px 20px 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.date-badge {
  font-size: 0.68rem;
  opacity: 0.6;
  letter-spacing: 0.04em;
}

/* SUMMARY ROW */
.summary-row {
  display: flex;
  gap: 8px;
}
.sum-chip {
  flex: 1;
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 8px 10px;
  text-align: center;
}
.sum-chip-label {
  font-size: 0.6rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0.55;
  display: block;
  margin-bottom: 2px;
}
.sum-chip-value {
  font-size: 0.85rem;
  font-weight: 500;
}
.sum-chip-value.green { color: #7ecfa3; }
.sum-chip-value.red { color: #f0a0a0; }

/* TOOLBAR */
.toolbar {
  display: flex;
  gap: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }

.btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 9px 16px;
  border: 1.5px solid var(--text);
  background: var(--text);
  color: var(--bg);
  cursor: pointer;
  letter-spacing: 0.04em;
  border-radius: 8px;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn-outline {
  background: transparent;
  color: var(--text);
}
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text);
}

/* CARDS */
.cards {
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  overflow: hidden;
  transition: box-shadow 0.15s;
}
.card.signal-buy { border-color: var(--buy-border); border-left: 4px solid var(--buy); }
.card.signal-sell { border-color: var(--sell-border); border-left: 4px solid var(--sell); }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
}
.card-name {
  font-size: 0.9rem;
  font-weight: 500;
}
.card-ticker {
  font-size: 0.7rem;
  color: var(--muted);
  font-style: italic;
  margin-top: 1px;
}
.card-signal {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  border-radius: 20px;
}
.card-signal.buy { background: var(--buy-bg); color: var(--buy); border: 1px solid var(--buy-border); }
.card-signal.sell { background: var(--sell-bg); color: var(--sell); border: 1px solid var(--sell-border); }
.card-signal.hold { background: var(--surface2); color: var(--neutral); border: 1px solid var(--border); }
.card-signal.empty { background: transparent; color: var(--muted); border: 1px dashed var(--border); }

/* CARD INPUTS */
.card-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}
.card-inputs > div {
  padding: 12px 16px;
  border-right: 1px solid var(--border);
}
.card-inputs > div:last-child { border-right: none; }
.input-label {
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
  display: block;
}
.card-input {
  font-family: 'DM Mono', monospace;
  font-size: 1rem;
  width: 100%;
  padding: 6px 0;
  border: none;
  border-bottom: 1.5px solid var(--border);
  background: transparent;
  color: var(--text);
  outline: none;
  -webkit-appearance: none;
}
.card-input:focus { border-bottom-color: var(--accent); }

/* CARD RESULT */
.card-result {
  padding: 12px 16px;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border);
}
.card-change {
  font-size: 0.78rem;
}
.card-amount {
  font-size: 1rem;
  font-weight: 500;
}
.card-amount.buy { color: var(--buy); }
.card-amount.sell { color: var(--sell); }
.card-amount.na { color: var(--muted); font-size: 0.8rem; }

/* CARD ACTIONS */
.card-actions {
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  border-top: 1px solid var(--border);
}
.btn-sm {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  padding: 5px 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  border-radius: 6px;
  letter-spacing: 0.04em;
  -webkit-tap-highlight-color: transparent;
}

/* X LABEL */
.x-label {
  font-size: 0.68rem;
  color: var(--muted);
  padding: 0 16px 10px;
}

/* BOTTOM NAV */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1.5px solid var(--border);
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  display: flex;
  gap: 10px;
}
.bottom-bar .btn { flex: 1; text-align: center; padding: 12px; font-size: 0.75rem; }

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 28px 24px;
  width: 100%;
  max-width: 500px;
  font-family: 'DM Mono', monospace;
  padding-bottom: max(28px, env(safe-area-inset-bottom));
}
.modal-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 20px;
}
.modal h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  margin-bottom: 20px;
}
.modal-field { margin-bottom: 16px; }
.modal-field label {
  display: block;
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.modal-field input {
  font-family: 'DM Mono', monospace;
  font-size: 1rem;
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  border-radius: 8px;
  outline: none;
  -webkit-appearance: none;
}
.modal-field input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { flex: 1; text-align: center; padding: 14px; font-size: 0.8rem; border-radius: 8px; }

/* CONFIRM SHEET */
.confirm-sheet {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
}
.confirm-sheet.open { display: flex; }
.confirm-inner {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 24px;
  width: 100%;
  max-width: 500px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}
.confirm-title { font-size: 1rem; font-weight: 500; margin-bottom: 8px; }
.confirm-msg { font-size: 0.78rem; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
.confirm-btns { display: flex; gap: 10px; }
.confirm-btns .btn { flex: 1; padding: 13px; text-align: center; border-radius: 8px; }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 0.78rem; line-height: 1.7; }

.change-neg { color: var(--buy); }
.change-pos { color: var(--sell); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>ETF Signal</h1>
    <span class="date-badge" id="todayDate"></span>
  </div>
  <div class="summary-row">
    <div class="sum-chip">
      <span class="sum-chip-label">Do kupienia</span>
      <span class="sum-chip-value green" id="sumBuy">— zł</span>
    </div>
    <div class="sum-chip">
      <span class="sum-chip-label">Do sprzedaży</span>
      <span class="sum-chip-value red" id="sumSell">— zł</span>
    </div>
    <div class="sum-chip">
      <span class="sum-chip-label">Sygnały</span>
      <span class="sum-chip-value" id="sumActive">—</span>
    </div>
  </div>
</div>

<div class="toolbar">
  <button class="btn btn-accent" onclick="openAddModal()">+ Dodaj ETF</button>
  <button class="btn btn-outline" onclick="askRollover()">⟳ Zamknij dzień</button>
  <button class="btn btn-outline" onclick="exportData()">↓ Eksport</button>
</div>

<div class="cards" id="cardsContainer"></div>

<div class="bottom-bar">
  <button class="btn btn-outline" onclick="askRollover()">⟳ Zamknij dzień</button>
  <button class="btn" onclick="openAddModal()">+ Dodaj ETF</button>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modalTitle">Dodaj ETF</h2>
    <div class="modal-field">
      <label>Nazwa ETF</label>
      <input type="text" id="mName" placeholder="np. Vanguard S&P 500 UCITS ETF" autocomplete="off">
    </div>
    <div class="modal-field">
      <label>Ticker</label>
      <input type="text" id="mTicker" placeholder="np. VUAA" autocomplete="off" style="text-transform:uppercase">
    </div>
    <div class="modal-field">
      <label>Kwota X (zł) — bazowa jednostka transakcji</label>
      <input type="number" id="mX" placeholder="np. 500" min="1" inputmode="decimal">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Anuluj</button>
      <button class="btn" onclick="saveEtf()">Zapisz</button>
    </div>
  </div>
</div>

<!-- CONFIRM SHEET -->
<div class="confirm-sheet" id="confirmSheet">
  <div class="confirm-inner">
    <div class="modal-handle"></div>
    <div class="confirm-title" id="confirmTitle">Potwierdzenie</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="btn btn-outline" onclick="closeConfirm()">Anuluj</button>
      <button class="btn" id="confirmOkBtn">OK</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'etf_signal_v3';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { etfs: [] }; }
  catch { return { etfs: [] }; }
}
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

let data = loadData();
let editingId = null;
let confirmCallback = null;

// ── FORMAT ────────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderCards() {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';

  if (data.etfs.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <h3>Brak ETF-ów</h3>
        <p>Kliknij "+ Dodaj ETF" żeby zacząć.<br>Możesz dodać dowolną liczbę instrumentów.</p>
      </div>`;
    updateSummary(0, 0, 0);
    return;
  }

  let totalBuy = 0, totalSell = 0, activeCount = 0;

  data.etfs.forEach((etf, idx) => {
    const prevPrice = parseFloat(etf.prevPrice) || null;
    const todayPrice = parseFloat(etf.todayPrice) || null;
    const X = parseFloat(etf.x) || null;

    let changePct = null, signal = 'empty', amount = null;

    if (prevPrice && todayPrice && prevPrice > 0 && X) {
      changePct = ((todayPrice - prevPrice) / prevPrice) * 100;
      if (changePct < -0.01) {
        signal = 'buy';
        amount = Math.abs(changePct) * X;
        totalBuy += amount;
        activeCount++;
      } else if (changePct > 0.01) {
        signal = 'sell';
        amount = changePct * 0.5 * X;   // ← połowa przy sprzedaży
        totalSell += amount;
        activeCount++;
      } else {
        signal = 'hold';
      }
    }

    const signalLabels = { buy: '▲ KUP', sell: '▼ SPRZEDAJ', hold: '= CZEKAJ', empty: '· · ·' };
    const changeClass = changePct == null ? '' : changePct < 0 ? 'change-neg' : 'change-pos';
    const changeStr = changePct != null ? (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%' : '—';
    const amountStr = amount != null ? fmt(amount) + ' zł' : '—';
    const amountClass = signal === 'buy' ? 'buy' : signal === 'sell' ? 'sell' : 'na';

    const card = document.createElement('div');
    card.className = `card${signal === 'buy' ? ' signal-buy' : signal === 'sell' ? ' signal-sell' : ''}`;
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-name">${etf.name || '—'}</div>
          <div class="card-ticker">${etf.ticker || ''} &nbsp;·&nbsp; X = ${etf.x ? fmt(parseFloat(etf.x)) : '—'} zł</div>
        </div>
        <span class="card-signal ${signal}">${signalLabels[signal]}</span>
      </div>
      <div class="card-inputs">
        <div>
          <span class="input-label">Cena bazowa</span>
          <input class="card-input" type="number" inputmode="decimal" step="0.0001"
            value="${etf.prevPrice || ''}" placeholder="0.0000"
            onchange="updateField(${idx}, 'prevPrice', this.value)">
        </div>
        <div>
          <span class="input-label">Cena dziś</span>
          <input class="card-input" type="number" inputmode="decimal" step="0.0001"
            value="${etf.todayPrice || ''}" placeholder="0.0000"
            onchange="updateField(${idx}, 'todayPrice', this.value)">
        </div>
      </div>
      <div class="card-result">
        <span class="card-change ${changeClass}">${changeStr}</span>
        <span class="card-amount ${amountClass}">${amountStr}</span>
      </div>
      <div class="card-actions">
        <button class="btn-sm" onclick="editEtf(${idx})">edytuj</button>
        <button class="btn-sm" onclick="askDelete(${idx})">usuń</button>
      </div>
    `;
    container.appendChild(card);
  });

  updateSummary(totalBuy, totalSell, activeCount);
}

function updateSummary(buy, sell, active) {
  document.getElementById('sumBuy').textContent = buy > 0 ? fmt(buy) + ' zł' : '— zł';
  document.getElementById('sumSell').textContent = sell > 0 ? fmt(sell) + ' zł' : '— zł';
  document.getElementById('sumActive').textContent = active + ' / ' + data.etfs.length;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function updateField(idx, field, value) {
  data.etfs[idx][field] = value;
  saveData(data);
  renderCards();
}

function askDelete(idx) {
  showConfirm(
    'Usunąć ETF?',
    `Czy na pewno chcesz usunąć "${data.etfs[idx].name}"?\nTej operacji nie można cofnąć.`,
    () => { data.etfs.splice(idx, 1); saveData(data); renderCards(); }
  );
}

function editEtf(idx) {
  editingId = idx;
  const etf = data.etfs[idx];
  document.getElementById('mName').value = etf.name || '';
  document.getElementById('mTicker').value = etf.ticker || '';
  document.getElementById('mX').value = etf.x || '';
  document.getElementById('modalTitle').textContent = 'Edytuj ETF';
  document.getElementById('addModal').classList.add('open');
}

function openAddModal() {
  editingId = null;
  document.getElementById('mName').value = '';
  document.getElementById('mTicker').value = '';
  document.getElementById('mX').value = '';
  document.getElementById('modalTitle').textContent = 'Dodaj ETF';
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('mName').focus(), 100);
}

function closeModal() {
  document.getElementById('addModal').classList.remove('open');
  editingId = null;
}

function saveEtf() {
  const name = document.getElementById('mName').value.trim();
  const ticker = document.getElementById('mTicker').value.trim().toUpperCase();
  const x = parseFloat(document.getElementById('mX').value);
  if (!name) { alert('Podaj nazwę ETF'); return; }
  if (!x || x <= 0) { alert('Podaj kwotę X > 0'); return; }

  if (editingId !== null) {
    Object.assign(data.etfs[editingId], { name, ticker, x });
  } else {
    data.etfs.push({ name, ticker, x, prevPrice: '', todayPrice: '' });
  }
  saveData(data);
  closeModal();
  renderCards();
}

function askRollover() {
  const withPrice = data.etfs.filter(e => e.todayPrice && parseFloat(e.todayPrice) > 0);
  if (withPrice.length === 0) { alert('Nie wpisano żadnych cen dzisiejszych.'); return; }
  showConfirm(
    '⟳ Zamknij dzień',
    `Dzisiejsza cena (${withPrice.length} ETF-ów) stanie się jutrzejszą ceną bazową.\nPole "Cena dziś" zostanie wyczyszczone — jutro wpisujesz nową cenę.`,
    () => {
      data.etfs.forEach(e => {
        if (e.todayPrice && parseFloat(e.todayPrice) > 0) e.prevPrice = e.todayPrice;
        e.todayPrice = '';
      });
      saveData(data);
      renderCards();
    }
  );
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `etf-signal-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

// ── CONFIRM SHEET ─────────────────────────────────────────────────────────────
function showConfirm(title, msg, onOk) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  confirmCallback = onOk;
  document.getElementById('confirmSheet').classList.add('open');
}
function closeConfirm() {
  document.getElementById('confirmSheet').classList.remove('open');
  confirmCallback = null;
}
document.getElementById('confirmOkBtn').addEventListener('click', () => {
  if (confirmCallback) confirmCallback();
  closeConfirm();
});

// Close modals on overlay tap
document.getElementById('addModal').addEventListener('click', e => { if (e.target === document.getElementById('addModal')) closeModal(); });
document.getElementById('confirmSheet').addEventListener('click', e => { if (e.target === document.getElementById('confirmSheet')) closeConfirm(); });

// Date
document.getElementById('todayDate').textContent =
  new Date().toLocaleDateString('pl-PL', { weekday: 'short', day: 'numeric', month: 'short' });

// Seed
if (data.etfs.length === 0) {
  data.etfs = [
    { name: 'Vanguard S&P 500 UCITS ETF', ticker: 'VUAA', x: 500, prevPrice: '', todayPrice: '' },
    { name: 'iShares MSCI World ex-US', ticker: 'EXUS', x: 300, prevPrice: '', todayPrice: '' },
    { name: 'iShares Core MSCI EM', ticker: 'EIMI', x: 200, prevPrice: '', todayPrice: '' },
    { name: 'iShares Physical Gold', ticker: 'IGLN', x: 300, prevPrice: '', todayPrice: '' },
    { name: 'iShares Global Corp Bond', ticker: 'CORP', x: 200, prevPrice: '', todayPrice: '' },
  ];
  saveData(data);
}

renderCards();
</script>
</body>
</html>
